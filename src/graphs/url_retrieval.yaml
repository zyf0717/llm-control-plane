id: url_retrieval
name: URL Retrieval
description: Fetch supplied URLs deterministically, then answer the user's prompt using the retrieved content.
input_schema:
  type: object
  required: [latest_user_prompt]
  properties:
    latest_user_prompt:
      type: string
    thread_briefing:
      type: string
    thread_state_text:
      type: string
    recent_conversation_messages:
      type: string
    thread_metadata:
      type: object
    manual_source_text:
      type: string
    uploaded_source_text:
      type: string
defaults:
  configurable:
    endpoint: smart
    reasoning_effort: high
ui:
  supports_streaming: true
  supports_interrupts: false
