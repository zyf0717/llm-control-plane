id: contextual_search
name: Contextual Search
version: 0.1.0
description: Use conversation context to plan targeted searches, dispatch them, then answer the latest prompt.

params_schema:
  type: object
  required: [latest_user_prompt]
  properties:
    latest_user_prompt:
      type: string
    conversation_context:
      type: string
    compacted_thread_state:
      type: string
    recent_conversation_tail:
      type: string
    server_conversation_context:
      type: string
    context_state:
      type: object
    context:
      type: string
    uploaded_context:
      type: string

defaults:
  reasoning_effort: high
  stream: false

steps:
  - id: plan_search_queries
    name: Plan search queries
    kind: llm
    chat_visibility: intermediate
    chat_stream: false
    prompt: |
      Latest user prompt:
      {{ params.latest_user_prompt }}

      Compacted prior thread state:
      {{ params.compacted_thread_state }}

      Recent raw conversation tail:
      {{ params.recent_conversation_tail }}

      Additional context:
      {{ params.conversation_context }}
      {{ params.context }}
      {{ params.uploaded_context }}

      Infer the user's actual information need from the latest turn in the
      full conversation context. Decide exactly what should be searched before
      any web lookup happens.

      Return strict JSON only:
      {
        "rerank_query": "one concise context-resolved information need for ranking candidate documents",
        "queries": [
          "concise web search query for the primary information need",
          "concise web search query for a materially different evidence angle"
        ],
        "reason": "why these searches answer the latest prompt in context",
        "source_preferences": ["preferred primary source domains or source types"]
      }

      Query rules:
      - `rerank_query` must resolve pronouns, ellipses, and references from conversation context.
      - `rerank_query` should describe the evidence needed to answer the user; do not use search operators.
      - Return 1 to 5 queries in "queries".
      - Use multiple queries only when they target materially different source angles.
      - Keep each query under 100 characters.
      - Prefer primary sources and exact named entities from the prompt/context.
      - Do not include markdown, bullets, or explanatory prose outside the JSON object.
    output_key: search_plan
    output_contract:
      format: json
      required: true
      schema:
        type: object
        additionalProperties: false
        required: [rerank_query, queries, reason, source_preferences]
        properties:
          rerank_query:
            type: string
            minLength: 3
            maxLength: 240
          queries:
            type: array
            minItems: 1
            maxItems: 5
            items:
              type: string
              minLength: 3
              maxLength: 100
          reason:
            type: string
            minLength: 1
          source_preferences:
            type: array
            items:
              type: string
              minLength: 1
      on_invalid:
        action: retry
        max_attempts: 2
        repair: true

  - id: search_results
    name: Search results
    kind: search
    search_count: 10
    use_query_refiner: false
    depends_on: [plan_search_queries]
    prompt: |
      {{ outputs.search_plan.json.queries }}
    output_key: search_results

  - id: rerank_results
    name: Rerank results
    kind: rerank
    rerank_top_k: 10
    depends_on: [search_results]
    rerank_context: |
      Latest user prompt:
      {{ params.latest_user_prompt }}

      Compacted prior thread state:
      {{ params.compacted_thread_state }}

      Recent raw conversation tail:
      {{ params.recent_conversation_tail }}

      Search plan reason:
      {{ outputs.search_plan.json.reason }}

      Source preferences:
      {{ outputs.search_plan.json.source_preferences }}
    prompt: |
      {{ outputs.search_plan.json.rerank_query }}
    output_key: search_results

  - id: consolidate_reply
    name: Consolidate reply
    kind: llm
    chat_visibility: final
    depends_on: [rerank_results]
    prompt: |
      Latest user prompt:
      {{ params.latest_user_prompt }}

      Compacted prior thread state:
      {{ params.compacted_thread_state }}

      Recent raw conversation tail:
      {{ params.recent_conversation_tail }}

      Additional context:
      {{ params.conversation_context }}
      {{ params.context }}
      {{ params.uploaded_context }}

      Search plan:
      {{ outputs.search_plan.text }}

      Search results:
      {{ outputs.search_results.text }}

      Answer the latest user prompt directly. Use the conversation context to
      preserve intent and constraints, and use the search results for factual
      grounding. Surface material uncertainty or missing evidence clearly.
    output_key: reply
