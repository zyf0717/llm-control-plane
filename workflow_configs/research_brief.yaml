id: research_brief
name: Research Brief
version: 0.1.0
description: Build a concise research brief from web search, optional Retrieval, and supplied source text.

params_schema:
  type: object
  required: [question]
  properties:
    question:
      type: string
    thread_state_text:
      type: string
    recent_conversation_messages:
      type: string
    thread_briefing:
      type: string
    thread_metadata:
      type: object
    manual_source_text:
      type: string
    uploaded_source_text:
      type: string

defaults:
  reasoning_effort: high
  stream: false

steps:
  - id: search_evidence
    name: Search evidence
    kind: search
    use_query_refiner: true
    prompt: |
      {{ params.question }}

      Prior thread context:
      {{ params.thread_state_text }}

      Recent conversation context:
      {{ params.recent_conversation_messages }}

      Additional context:
      {{ params.manual_source_text }}
      {{ params.uploaded_source_text }}
    output_key: search_evidence

  - id: rerank_search_evidence
    name: Rerank search evidence
    kind: rerank
    depends_on: [search_evidence]
    rerank_source_text: |
      Question:
      {{ params.question }}

      Prior thread context:
      {{ params.thread_state_text }}

      Recent conversation context:
      {{ params.recent_conversation_messages }}

      Manual context:
      {{ params.manual_source_text }}

      Uploaded context:
      {{ params.uploaded_source_text }}
    prompt: |
      {{ params.question }}
    output_key: search_evidence

  - id: synthesize_brief
    name: Synthesize brief
    kind: llm
    chat_visibility: final
    depends_on: [rerank_search_evidence]
    prompt: |
      Question:
      {{ params.question }}

      Prior thread context:
      {{ params.thread_state_text }}

      Recent conversation context:
      {{ params.recent_conversation_messages }}

      Manual context:
      {{ params.manual_source_text }}

      Uploaded context:
      {{ params.uploaded_source_text }}

      Search context:
      {{ outputs.search_evidence.text }}

      Produce a concise research brief with key findings, uncertainty, and recommended next steps.
    output_key: research_brief
