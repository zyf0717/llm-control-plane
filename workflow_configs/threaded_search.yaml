id: threaded_search
name: Threaded Search
version: 0.1.0
description: Use thread briefing to plan targeted searches, dispatch them, then answer the latest prompt.

params_schema:
  type: object
  required: [latest_user_prompt]
  properties:
    latest_user_prompt:
      type: string
    thread_briefing:
      type: string
    thread_state_text:
      type: string
    recent_conversation_messages:
      type: string
    thread_metadata:
      type: object
    manual_source_text:
      type: string
    uploaded_source_text:
      type: string

defaults:
  reasoning_effort: high
  stream: false

steps:
  - id: plan_search_queries
    name: Plan search queries
    kind: llm
    chat_visibility: intermediate
    chat_stream: false
    prompt: |
      Latest user prompt:
      {{ params.latest_user_prompt }}

      Prior thread context:
      {{ params.thread_state_text }}

      Recent conversation context:
      {{ params.recent_conversation_messages }}

      Additional context:
      {{ params.thread_briefing }}
      {{ params.manual_source_text }}
      {{ params.uploaded_source_text }}

      Infer the user's actual information need from the latest turn in the
      full thread context. Decide exactly what should be searched before
      any web lookup happens.

      Return strict JSON only:
      {
        "rerank_query": "one concise thread-resolved information need for ranking candidate documents",
        "queries": [
          "concise web search query for the primary information need",
          "concise web search query for a materially different evidence angle"
        ],
        "reason": "why these searches answer the latest prompt with the thread context",
        "source_preferences": ["preferred primary source domains or source types"]
      }

      Query rules:
      - `rerank_query` must resolve pronouns, ellipses, and references from thread context.
      - `rerank_query` should describe the evidence needed to answer the user; do not use search operators.
      - Return 1 to 5 queries in "queries".
      - Use multiple queries only when they target materially different source angles.
      - Keep each query under 100 characters.
      - Prefer primary sources and exact named entities from the prompt/context.
      - Do not include markdown, bullets, or explanatory prose outside the JSON object.
    output_key: search_plan
    output_contract:
      format: json
      required: true
      schema:
        type: object
        additionalProperties: false
        required: [rerank_query, queries, reason, source_preferences]
        properties:
          rerank_query:
            type: string
            minLength: 3
            maxLength: 240
          queries:
            type: array
            minItems: 1
            maxItems: 5
            items:
              type: string
              minLength: 3
              maxLength: 100
          reason:
            type: string
            minLength: 1
          source_preferences:
            type: array
            items:
              type: string
              minLength: 1
      on_invalid:
        action: retry
        max_attempts: 2
        repair: true

  - id: search_evidence
    name: Search evidence
    kind: search
    search_count: 5
    use_query_refiner: false
    depends_on: [plan_search_queries]
    prompt: |
      {{ outputs.search_plan.json.queries }}
    output_key: search_evidence

  - id: rerank_results
    name: Rerank results
    kind: rerank
    rerank_top_k: 5
    depends_on: [search_evidence]
    rerank_source_text: |
      Latest user prompt:
      {{ params.latest_user_prompt }}

      Prior thread context:
      {{ params.thread_state_text }}

      Recent conversation context:
      {{ params.recent_conversation_messages }}

      Search plan reason:
      {{ outputs.search_plan.json.reason }}

      Source preferences:
      {{ outputs.search_plan.json.source_preferences }}
    prompt: |
      {{ outputs.search_plan.json.rerank_query }}
    output_key: search_evidence

  - id: consolidate_reply
    name: Consolidate reply
    kind: llm
    chat_visibility: final
    depends_on: [rerank_results]
    prompt: |
      Latest user prompt:
      {{ params.latest_user_prompt }}

      Prior thread context:
      {{ params.thread_state_text }}

      Recent conversation context:
      {{ params.recent_conversation_messages }}

      Additional context:
      {{ params.thread_briefing }}
      {{ params.manual_source_text }}
      {{ params.uploaded_source_text }}

      Search plan:
      {{ outputs.search_plan.text }}

      Search context:
      {{ outputs.search_evidence.text }}

      Answer the latest user prompt directly. Use the thread context to
      preserve intent and constraints, and use the search context for factual
      grounding. Surface material uncertainty or missing evidence clearly.
    output_key: reply
