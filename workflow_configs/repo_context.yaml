id: repo_context
name: Repo Context
version: 0.2.0
description: Explore one local repository and consolidate a repository-grounded answer.

params_schema:
  type: object
  required: [query, repo_name]
  properties:
    query:
      type: string
    repo_name:
      type: string

steps:
  - id: plan_repo_context_query
    name: Plan repo-context query
    kind: llm
    endpoint: gmktec-evo-x2-utility
    chat_visibility: hidden
    prompt: |
      User request:
      {{ params.query }}

      Repository:
      {{ params.repo_name }}

      Produce one focused repo-context exploration query that will retrieve the
      repository evidence needed to answer the request. Keep it specific and
      action-oriented.
    output_key: repo_context_plan
    output_contract:
      format: json
      required: true
      schema:
        type: object
        additionalProperties: false
        required: [query]
        properties:
          query:
            type: string
            minLength: 1

  - id: explore_repository
    name: Explore repository
    kind: repo_context
    depends_on: [plan_repo_context_query]
    prompt: "{{ outputs.repo_context_plan.json.query }}"
    repo_context_repo: "{{ params.repo_name }}"
    repo_context_max_turns: 6
    output_key: repo_context
    chat_visibility: hidden

  - id: consolidate_reply
    name: Consolidate reply
    kind: llm
    chat_visibility: final
    depends_on: [explore_repository]
    prompt: |
      Original request:
      {{ params.query }}

      Repository:
      {{ params.repo_name }}

      Repo-context exploration query:
      {{ outputs.repo_context_plan.json.query }}

      Repo-context evidence:
      {{ outputs.repo_context.text }}

      Answer the original request directly using the repo-context evidence.
      Preserve relevant file paths and line ranges. Surface uncertainty or
      missing evidence clearly; do not invent repository details.
    output_key: reply
