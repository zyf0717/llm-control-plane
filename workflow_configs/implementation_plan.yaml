id: implementation_plan
name: Implementation Plan
version: 0.2.0
description: Produce a staged implementation plan from search, optional Retrieval, and supplied source text.

params_schema:
  type: object
  required: [goal]
  properties:
    goal:
      type: string
    thread_state_text:
      type: string
    recent_conversation_messages:
      type: string
    thread_briefing:
      type: string
    thread_metadata:
      type: object
    manual_source_text:
      type: string
    uploaded_source_text:
      type: string

defaults:
  reasoning_effort: high
  stream: false

steps:
  - id: search_evidence
    name: Search evidence
    kind: search
    use_query_refiner: true
    prompt: |
      {{ params.goal }}

      Prior thread context:
      {{ params.thread_state_text }}

      Recent conversation context:
      {{ params.recent_conversation_messages }}

      Additional context:
      {{ params.manual_source_text }}
      {{ params.uploaded_source_text }}
    output_key: search_evidence

  - id: rerank_search_evidence
    name: Rerank search evidence
    kind: rerank
    depends_on: [search_evidence]
    rerank_source_text: |
      Goal:
      {{ params.goal }}

      Prior thread context:
      {{ params.thread_state_text }}

      Recent conversation context:
      {{ params.recent_conversation_messages }}

      Manual context:
      {{ params.manual_source_text }}

      Uploaded context:
      {{ params.uploaded_source_text }}
    prompt: |
      {{ params.goal }}
    output_key: search_evidence

  - id: target_assessment
    name: Target assessment
    kind: llm
    chat_visibility: intermediate
    depends_on: [rerank_search_evidence]
    prompt: |
      Goal:
      {{ params.goal }}

      Prior thread context:
      {{ params.thread_state_text }}

      Recent conversation context:
      {{ params.recent_conversation_messages }}

      Manual context:
      {{ params.manual_source_text }}

      Uploaded context:
      {{ params.uploaded_source_text }}

      Search context:
      {{ outputs.search_evidence.text }}

      Identify the target state, constraints, non-goals, risks, and missing information.
    output_key: target_assessment

  - id: architecture_plan
    name: Architecture plan
    kind: llm
    chat_visibility: intermediate
    depends_on: [target_assessment]
    prompt: |
      Goal:
      {{ params.goal }}

      Target assessment:
      {{ outputs.target_assessment.text }}

      Produce the implementation architecture, module boundaries, data flow, and failure handling.
    output_key: architecture_plan

  - id: commit_plan
    name: Commit and test plan
    kind: llm
    chat_visibility: final
    depends_on: [architecture_plan]
    prompt: |
      Architecture plan:
      {{ outputs.architecture_plan.text }}

      Produce a sequenced commit plan with tests, acceptance criteria, and rollout notes.
    output_key: commit_plan
