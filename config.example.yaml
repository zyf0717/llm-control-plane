# Each endpoint selects one model; model may be omitted for a single-model URL.
endpoints:
  primary:
    url: http://localhost:8000
    model: your-model-id  # Replace with an advertised model ID, or omit.
    slot_affinity: false
  fast:
    url: http://localhost:8001
    # Discover the model automatically when exactly one is advertised.
dashboard:
  display_timezone: UTC
orchestration:
  workflows:
    enabled: true
  graphs:
    enabled: true
repo_context:
  enabled: true
  project_dir: /path/to/repo-context
  repos_root: /path/to/repos
  entry_point:
    command: uv
    args:
    - run
    - --project
    - /path/to/repo-context
    - repo-context
    env: {}
  default_max_turns: 6
  timeout_seconds: 180
  max_concurrent: 2
retrieval:
  default_endpoint: http://localhost:8100/api/retrieve/context
  endpoints:
  - name: local-retrieval
    retrieve_url: http://localhost:8100/api/retrieve/context
    health_url: http://localhost:8100/api/health
  top_k: 10
search:
  enabled: false
  query_refiner_enabled: false
  query_refiner_timeout_ms: 7000
  query_refiner_max_source_chars: 12000
  query_refiner_max_output_tokens: 512
  query_refiner_max_queries: 1
  reranker_backend: llm
  reranker_enabled: false
  reranker_timeout_ms: 7000
  reranker_max_source_chars: 12000
  reranker_max_candidates: 20
  reranker_max_output_tokens: 1024
  search_max_total_results: 10
  default_provider: duckduckgo_html
  timeout_ms: 7000
  max_results: 20
  cache_ttl_seconds: 900
  max_body_bytes: 2500000
  max_retries: 1
  providers:
    duckduckgo_html:
      enabled: true
      priority: 10
    marginalia_html:
      enabled: true
      priority: 20
    mojeek_html:
      enabled: false
      priority: 30
    wikipedia_opensearch:
      enabled: false
      priority: 40
      fallback_only: true
    searxng_html:
      enabled: false
      priority: 50
      fallback_only: true
      endpoint: http://localhost:8080/search
workloads:
  utility: [fast, primary]
  complex: [primary, fast]
  responsive: [fast, primary]
  vision: [primary]  # Include only endpoints serving vision-capable models.
