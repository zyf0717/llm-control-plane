# Copy to config.yaml and replace URLs/model names for your deployment.
endpoints:
  - name: "primary"
    url: "http://localhost:8000"
    slot_affinity: false  # best-effort llama.cpp id_slot/cache_prompt affinity
    gpu: "NVIDIA GPU"
    vram: "24GB"
    cpu: "x86_64"
    ram: "64GB"

  - name: "fast-local"
    url: "http://localhost:8001"
    soc: "Apple Silicon"
    ram: "16GB"

dashboard:
  display_timezone: "Asia/Singapore"

rag:
  default_endpoint: "http://localhost:8100/api/retrieve/context"
  endpoints:
    - name: "local-rag"
      retrieve_url: "http://localhost:8100/api/retrieve/context"
      health_url: "http://localhost:8100/api/health"
  top_k: 10

search:
  enabled: false
  query_refiner_model_endpoint: ""
  query_refiner_model: "search-query-refiner"
  query_refiner_enabled: false
  query_refiner_timeout_ms: 7000
  query_refiner_max_context_chars: 12000
  query_refiner_max_output_tokens: 512
  query_refiner_max_queries: 1
  reranker_model_endpoint: ""
  reranker_fallback_model_endpoint: ""
  reranker_backend: "llm"
  reranker_model: "search-reranker"
  reranker_enabled: false
  reranker_timeout_ms: 7000
  reranker_max_context_chars: 12000
  reranker_max_candidates: 20
  reranker_max_output_tokens: 1024
  search_max_total_results: 10
  default_provider: "duckduckgo_html"
  timeout_ms: 7000
  max_results: 10
  cache_ttl_seconds: 900
  max_body_bytes: 2500000
  max_retries: 1
  providers:
    duckduckgo_html:
      enabled: true
      priority: 10
    marginalia_html:
      enabled: true
      priority: 20
    mojeek_html:
      enabled: false
      priority: 30
    wikipedia_opensearch:
      enabled: false
      priority: 40
      fallback_only: true
    searxng_html:
      enabled: false
      priority: 50
      fallback_only: true
      endpoint: "http://localhost:8080/search"

workloads:
  - type: "reasoning"
    endpoint_preference: ["primary", "fast-local"]
  - type: "programming"
    endpoint_preference: ["primary", "fast-local"]
  - type: "tokens_per_second"
    endpoint_preference: ["fast-local", "primary"]
  - type: "ttft_content"
    endpoint_preference: ["fast-local", "primary"]
  - type: "classification"
    endpoint_preference: ["fast-local", "primary"]
