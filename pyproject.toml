[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-control-plane"
version = "0.1.0"
description = "Exploratory LLM control plane for tools, retrieval, search, and workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite",
  "beautifulsoup4",
  "fastapi>=0.143.3,<0.144",
  "httpx",
  "langgraph>=1.2.16,<2",
  "jsonschema>=4.23",
  "python-dotenv",
  "PyYAML",
  "shiny>=1.8.0,<2",
  "shinychat>=0.7.2,<0.8",
  "shinyswatch>=0.13.1,<0.14",
  "uvicorn>=0.54.0,<0.55",
  "trafilatura>=2.3.1",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4.0,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
