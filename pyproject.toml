[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-control-plane"
version = "0.1.0"
description = "Exploratory LLM control plane for tools, retrieval, search, and workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite",
  "aiohttp",
  "beautifulsoup4",
  "fastapi",
  "httpx",
  "langgraph>=0.2",
  "jsonschema>=4.23",
  "pandas",
  "plotly==5.24.1",
  "python-dotenv",
  "PyYAML",
  "requests",
  "shiny",
  "shinyswatch",
  "shinywidgets",
  "statsmodels",
  "uvicorn",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
